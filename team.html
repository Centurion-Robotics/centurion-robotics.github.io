<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Our Team | Centurion Robotics 22689</title>

    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        :root {
            --gold: #F9BB17;
            --gold-hover: #e0a60d;
            --cream: #E5D1B1;
            --page: #0c0c0e;
            --card: #1A1A1A;
        }

        main {
            min-height: 100vh;
            padding: 60px 20px;
            color: #fff;
            background:
                radial-gradient(circle at 80% 20%, rgba(249,187,23,.18), transparent 55%),
                radial-gradient(circle at 20% 80%, rgba(212,143,14,.12), transparent 50%),
                var(--page);
        }

        .team-wrapper {
            width: min(1370px, 100%);
            margin: 0 auto;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }

        .team-header h1 {
            margin: 0;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            font-weight: 700;
        }

        .season-btn {
            padding: 10px 22px;
            border: 0;
            border-radius: 10px;
            background: var(--gold);
            color: var(--page);
            font: inherit;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 0 rgba(249,187,23,0);
            transition: background-color .28s ease, color .28s ease,
                        transform .28s cubic-bezier(.2,.8,.2,1),
                        box-shadow .28s ease;
        }
        .season-btn:hover, .season-btn:focus-visible {
            background: var(--gold-hover);
            color: var(--page);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(249,187,23,.28);
        }
        .season-btn:active {
            transform: translateY(-1px) scale(.98);
            box-shadow: 0 3px 10px rgba(249,187,23,.2);
        }
        .season-btn i {
            display: inline-block;
            margin-left: 5px;
            transition: transform .28s ease;
        }
        .season-btn[aria-expanded="true"] i {
            transform: rotate(180deg);
        }
        .season-dropdown {
            position: relative;
            z-index: 1000;
        }

        .season-menu {
            position: absolute;
            z-index: 1001;
            top: calc(100% + 8px);
            right: 0;

            width: 290px;
            padding: 10px;

            background: #1A1A1A;
            border: 1px solid #F9BB17;
            border-radius: 10px;

            box-shadow: 0 12px 30px rgba(0,0,0,.5);

            transform: translateY(-12px);
            opacity: 0;
            visibility: hidden;

            transition: opacity .28s ease,
                        transform .28s ease,
                        visibility .28s ease;
        }

        .season-menu.is-open {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }
        .season-menu[hidden] { display: none; }

        .season-option {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #fff;
            font: inherit;
            font-size: 17px;
            text-align: left;
            cursor: pointer;
            transition: background-color .2s ease, color .2s ease;
        }
        .season-option + .season-option { margin-top: 4px; }
        .season-option:hover, .season-option:focus-visible {
            background: rgba(249,187,23,.15);
            color: var(--gold);
            outline: none;
        }
        .season-option[aria-current="true"] {
            background: rgba(249,187,23,.12);
            color: var(--gold);
            font-weight: 700;
        }
        .season-option i { visibility: hidden; }
        .season-option[aria-current="true"] i { visibility: visible; }

        .team-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
            gap: 28px;
            padding: 35px 0 20px;
        }

        .member-card {
            min-width: 0;
            padding: 28px 20px;
            border-bottom: 5px solid var(--gold);
            border-radius: 15px;
            background: var(--card);
            text-align: center;
        }

        .member-photo, .member-placeholder {
            display: grid;
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
            place-items: center;
            border: 3px solid var(--gold);
            border-radius: 50%;
            object-fit: cover;
            background: #292929;
        }
        .member-placeholder {
            color: var(--gold);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .member-name {
            margin: 10px 0 5px;
            font-size: 1.45rem;
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        .member-role {
            color: var(--cream);
            font-size: 1.05rem;
        }

        @media (max-width: 600px) {
            main { padding: 38px 16px; }
            .team-header { align-items: flex-start; }
            .team-container { gap: 18px; }
        }

        /* Entrance animations */
        @media (prefers-reduced-motion: no-preference) {
            main h1 {
                opacity: 0;
                transform: scale(.96);
                animation: heading-appear .8s ease .15s forwards;
            }

            .team-container .member-card {
                opacity: 0;
                transform: translateY(45px);
            }

            .team-container .member-card.in-view {
                animation: move-up .8s ease forwards;
            }

            .team-container .member-card:nth-child(1).in-view { animation-delay: .05s; }
            .team-container .member-card:nth-child(2).in-view { animation-delay: .10s; }
            .team-container .member-card:nth-child(3).in-view { animation-delay: .15s; }
            .team-container .member-card:nth-child(4).in-view { animation-delay: .20s; }
            .team-container .member-card:nth-child(5).in-view { animation-delay: .25s; }
            .team-container .member-card:nth-child(6).in-view { animation-delay: .30s; }
            .team-container .member-card:nth-child(7).in-view { animation-delay: .35s; }
            .team-container .member-card:nth-child(8).in-view { animation-delay: .40s; }
            .team-container .member-card:nth-child(9).in-view { animation-delay: .45s; }
            .team-container .member-card:nth-child(10).in-view { animation-delay: .50s; }

            @keyframes move-up {
                to { opacity: 1; transform: translateY(0); }
            }

            @keyframes heading-appear {
                to { opacity: 1; transform: scale(1); }
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .season-btn, .season-menu { transition: none !important; }
        }
    </style>
</head>

                    { name: 'Manmohit Mahi', role: 'Mechanical Division Lead',
                      photo: WIX + 'efa344_d10999fc32dd4a0da1c20042ccb2f693~mv2.png' + FILL + 'IMG_7594_HEIC.png' },
                    { name: 'Samuel Khan', role: 'Software Division Lead',

                    { name: 'Ved Lad', role: 'CAD Team Lead',
                      photo: WIX + 'efa344_0a6cf51c938f45c7be6a2e7c3961ea49~mv2.png/v1/crop/x_584,y_906,w_1896,h_2277/fill/w_538,h_646,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/IMG_7585_HEIC.png' },

                    { name: 'Allan Lan',
                      photo: WIX + 'efa344_38eec8a2809c44d2a82e1c80aefe7d81~mv2.png/v1/crop/x_604,y_931,w_1866,h_2242/fill/w_538,h_646,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/IMG_7611_HEIC.png' },

                    { name: 'Nathan Lee',
                      photo: WIX + 'efa344_6bb77db5d5644af7ab41d78946775e52~mv2.png/v1/crop/x_425,y_983,w_2163,h_2599/fill/w_538,h_646,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/IMG_7619_HEIC.png' },

                members: [

                      photo: 'images/photos/Sourav_25.jpeg' }
                ]
            }
        ];

        /* ------------------------------------------------------------
           RENDERING
        ------------------------------------------------------------ */
        const DEFAULT_ROLE = 'Team Member';
        const container = document.getElementById('team-container');
        const menu = document.getElementById('season-menu');
        const button = document.getElementById('season-toggle');
        const buttonLabel = document.getElementById('season-label');
        let currentSeasonId = SEASONS[0].id;

        const cardObserver = 'IntersectionObserver' in window
            ? new IntersectionObserver((entries, observer) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in-view');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12 })
            : null;

        function initialsOf(name) {
            return name.split(/\s+/).slice(0, 2).map(part => part[0]).join('').toUpperCase();
        }

        function makePlaceholder(name) {
            const avatar = document.createElement('div');
            avatar.className = 'member-placeholder';
            avatar.setAttribute('role', 'img');
            avatar.setAttribute('aria-label', 'Photo unavailable for ' + name);
            avatar.textContent = initialsOf(name);
            return avatar;
        }

        function makeCard(member) {
            const card = document.createElement('article');
            card.className = 'member-card';

            let photo;
            if (member.photo) {
                photo = document.createElement('img');
                photo.className = 'member-photo';
                photo.src = member.photo;
                photo.alt = 'Photo of ' + member.name;
                photo.loading = 'lazy';
                photo.decoding = 'async';
                photo.addEventListener('error', () => {
                    photo.replaceWith(makePlaceholder(member.name));
                }, { once: true });
            } else {
                photo = makePlaceholder(member.name);
            }

            const name = document.createElement('div');
            name.className = 'member-name';
            name.textContent = member.name;

            const role = document.createElement('div');
            role.className = 'member-role';
            role.textContent = member.role || DEFAULT_ROLE;

            card.append(photo, name, role);
            return card;
        }

        function renderSeason(id) {
            const season = SEASONS.find(s => s.id === id) || SEASONS[0];
            currentSeasonId = season.id;

            buttonLabel.textContent = season.label;
            menu.querySelectorAll('.season-option').forEach((option) => {
                if (option.dataset.season === season.id) {
                    option.setAttribute('aria-current', 'true');
                } else {
                    option.removeAttribute('aria-current');
                }
            });

            container.replaceChildren();
            season.members.forEach((member) => {
                const card = makeCard(member);
                container.appendChild(card);
                if (cardObserver) {
                    cardObserver.observe(card);
                } else {
                    card.classList.add('in-view');
                }
            });
        }

        function buildMenu() {
            SEASONS.forEach((season) => {
                const option = document.createElement('button');
                option.type = 'button';
                option.className = 'season-option';
                option.dataset.season = season.id;

                const text = document.createElement('span');
                text.textContent = season.menuLabel || season.label;

                const check = document.createElement('i');
                check.className = 'fa-solid fa-check';
                check.setAttribute('aria-hidden', 'true');

                option.append(text, check);
                option.addEventListener('click', () => {
                    renderSeason(season.id);
                    setOpen(false);
                    button.focus();
                });
                menu.appendChild(option);
            });
        }

        /* ------------------------------------------------------------
           DROPDOWN OPEN / CLOSE
        ------------------------------------------------------------ */
        let closeTimer;

        function setOpen(open) {
            window.clearTimeout(closeTimer);
            button.setAttribute('aria-expanded', String(open));

            if (open) {
                menu.hidden = false;
                requestAnimationFrame(() => menu.classList.add('is-open'));
            } else {
                menu.classList.remove('is-open');
                closeTimer = window.setTimeout(() => {
                    menu.hidden = true;
                }, 260);
            }
        }

        button.addEventListener('click', () => {
            setOpen(button.getAttribute('aria-expanded') !== 'true');
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.season-dropdown')) setOpen(false);
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && button.getAttribute('aria-expanded') === 'true') {
                setOpen(false);
                button.focus();
            }
        });

        buildMenu();
        renderSeason(currentSeasonId);
    </script>
            <script>
            (() => {
                const nav = document.querySelector('.navigation');
                if (!nav) return;
                function check() {
                    const y = Math.max(window.scrollY || 0, document.documentElement.scrollTop || 0, document.body.scrollTop || 0);
                    if (y > 40) {
                        nav.classList.add('nav-pinned');
                        document.removeEventListener('scroll', check, true);
                    }
                }
                document.addEventListener('scroll', check, { capture: true, passive: true });
                check();
            })();
        </script>
